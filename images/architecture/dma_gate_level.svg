<title id="title">DMA Controller Gate-Level Logic Architecture</title><desc id="desc">Conceptual RTL-derived logic decomposition showing per-channel state and datapath registers, adaptive burst logic, arbitration, multiplexing, configuration registers, and PMU counters. Not a technology-mapped netlist.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3d5872"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#182b40}.h1{font-size:30px;font-weight:bold}.sub{font-size:16px;fill:#52677d}.h{font-size:19px;font-weight:bold}.t{font-size:15px}.s{font-size:13px;fill:#40566c}.b{stroke:#8ca2b7;stroke-width:1.6;rx:10}.w{fill:none;stroke:#3d5872;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.d{fill:none;stroke:#8295a7;stroke-width:1.8;stroke-dasharray:7 5}</style></defs>
<rect width="1600" height="1180" fill="#f5f8fc"/>
<text x="55" y="55" class="h1">4-Channel Adaptive Burst DMA — Logic-Level Architecture</text>
<text x="55" y="84" class="sub">RTL-derived conceptual view • sequential elements + combinational logic • not a mapped standard-cell netlist</text>
