<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc">
  <title id="title">4-Channel Adaptive Burst DMA Controller Architecture</title>
  <desc id="desc">Top-level hardware block diagram showing the host configuration interface, control register file, four DMA channel engines with adaptive burst control, round-robin arbiter, shared memory interface multiplexer, external memory interface, and performance monitoring unit.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#476581"/></marker>
    <marker id="arrowBothStart" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#476581"/></marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8394a7"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b42}
      .title{font-size:30px;font-weight:700;letter-spacing:.1px}
      .subtitle{font-size:15px;fill:#52677d}
      .heading{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:600}
      .body{font-size:13px;fill:#40566c}
      .small{font-size:12px;fill:#52677d}
      .block{stroke:#9cb0c3;stroke-width:1.5;rx:12}
      .wire{fill:none;stroke:#476581;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .monitor{fill:none;stroke:#8394a7;stroke-width:1.7;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round}
      .pill{font-size:12px;font-weight:700;fill:#315773}
    </style>
  </defs>
  <rect width="1440" height="1010" fill="#f5f8fc"/>
  <text x="60" y="53" class="title">4-Channel Adaptive Burst DMA Controller</text>
  <text x="60" y="80" class="subtitle">RTL architecture • Verilog-2001 • 32-bit memory datapath • 1 / 4 / 8 / 16-word burst levels</text>

  <!-- Host and control path -->
  <rect x="60" y="112" width="265" height="125" class="block" fill="#e9f2fb"/>
  <text x="82" y="143" class="heading">Host / SoC Interconnect</text>
  <text x="82" y="172" class="body">cfg_addr[7:0], cfg_wdata[31:0]</text>
  <text x="82" y="193" class="body">cfg_write_en, cfg_read_en</text>
  <text x="82" y="214" class="body">cfg_rdata[31:0], cfg_ready</text>

  <rect x="405" y="112" width="390" height="125" class="block" fill="#dceafa"/>
  <text x="430" y="143" class="heading">Configuration &amp; Control</text>
  <text x="430" y="172" class="body">Source / destination / length registers</text>
  <text x="430" y="193" class="body">Start control and per-channel burst size</text>
  <text x="430" y="214" class="body">Adaptive-mode and PMU register access</text>
  <path d="M325 174 H397" class="wire" marker-end="url(#arrow)"/>
  <text x="361" y="160" text-anchor="middle" class="small">CSR</text>

  <rect x="1000" y="112" width="380" height="125" class="block" fill="#edf1f7"/>
  <text x="1025" y="143" class="heading">Top-Level Integration</text>
  <text x="1025" y="172" class="body">dma_final</text>
  <text x="1025" y="193" class="body">Channel integration, bus selection, counters</text>
  <text x="1025" y="214" class="body">Active-low reset: rst_n</text>
  <path d="M795 174 H987" class="wire" marker-end="url(#arrow)"/>
  <text x="890" y="160" text-anchor="middle" class="small">configuration / status</text>

  <!-- Channel array -->
  <rect x="50" y="285" width="1340" height="255" rx="18" fill="#ffffff" stroke="#b5c7d8" stroke-width="1.6"/>
  <text x="76" y="316" class="heading">Four Independent DMA Channel Engines</text>
  <text x="1360" y="316" text-anchor="end" class="small">4 × dma_channel_final</text>

  <path d="M600 237 V263 H720 V277" class="wire" marker-end="url(#arrow)"/>
  <path d="M720 263 H190 V352" class="wire" opacity=".7"/>
  <path d="M470 263 V352 M750 263 V352 M1030 263 V352" class="wire" marker-end="url(#arrow)" opacity=".7"/>

  <!-- Channel 0 -->
  <rect x="75" y="340" width="280" height="174" class="block" fill="#e6f4ed"/>
  <text x="95" y="369" class="label">CH0</text>
  <text x="335" y="369" text-anchor="end" class="small">CHANNEL_ID = 0</text>
  <line x1="95" y1="382" x2="335" y2="382" stroke="#bfd9cb"/>
  <text x="95" y="405" class="body">5-state transfer FSM</text>
  <text x="95" y="427" class="body">Source / destination counters</text>
  <text x="95" y="449" class="body">Remaining length + read buffer</text>
  <rect x="95" y="466" width="240" height="30" rx="7" fill="#d0e9dc"/>
  <text x="215" y="486" text-anchor="middle" class="pill">Adaptive burst control</text>

  <!-- Channel 1 -->
  <rect x="390" y="340" width="280" height="174" class="block" fill="#e6f4ed"/>
  <text x="410" y="369" class="label">CH1</text>
  <text x="650" y="369" text-anchor="end" class="small">CHANNEL_ID = 1</text>
  <line x1="410" y1="382" x2="650" y2="382" stroke="#bfd9cb"/>
  <text x="410" y="405" class="body">5-state transfer FSM</text>
  <text x="410" y="427" class="body">Source / destination counters</text>
  <text x="410" y="449" class="body">Remaining length + read buffer</text>
  <rect x="410" y="466" width="240" height="30" rx="7" fill="#d0e9dc"/>
  <text x="530" y="486" text-anchor="middle" class="pill">Adaptive burst control</text>

  <!-- Channel 2 -->
  <rect x="705" y="340" width="280" height="174" class="block" fill="#e6f4ed"/>
  <text x="725" y="369" class="label">CH2</text>
  <text x="965" y="369" text-anchor="end" class="small">CHANNEL_ID = 2</text>
  <line x1="725" y1="382" x2="965" y2="382" stroke="#bfd9cb"/>
  <text x="725" y="405" class="body">5-state transfer FSM</text>
  <text x="725" y="427" class="body">Source / destination counters</text>
  <text x="725" y="449" class="body">Remaining length + read buffer</text>
  <rect x="725" y="466" width="240" height="30" rx="7" fill="#d0e9dc"/>
  <text x="845" y="486" text-anchor="middle" class="pill">Adaptive burst control</text>

  <!-- Channel 3 -->
  <rect x="1020" y="340" width="345" height="174" class="block" fill="#e6f4ed"/>
  <text x="1040" y="369" class="label">CH3</text>
  <text x="1345" y="369" text-anchor="end" class="small">CHANNEL_ID = 3</text>
  <line x1="1040" y1="382" x2="1345" y2="382" stroke="#bfd9cb"/>
  <text x="1040" y="405" class="body">5-state transfer FSM</text>
  <text x="1040" y="427" class="body">Source / destination counters</text>
  <text x="1040" y="449" class="body">Remaining length + read buffer</text>
  <rect x="1040" y="466" width="305" height="30" rx="7" fill="#d0e9dc"/>
  <text x="1192" y="486" text-anchor="middle" class="pill">Adaptive burst control</text>

  <!-- Arbitration and shared memory path -->
  <path d="M215 540 V572 H355 V605" class="wire" marker-start="url(#arrowBothStart)" marker-end="url(#arrow)"/>
  <path d="M530 540 V577 H430 V605" class="wire" marker-start="url(#arrowBothStart)" marker-end="url(#arrow)"/>
  <path d="M845 540 V577 H480 V605" class="wire" marker-start="url(#arrowBothStart)" marker-end="url(#arrow)"/>
  <path d="M1192 540 V572 H535 V605" class="wire" marker-start="url(#arrowBothStart)" marker-end="url(#arrow)"/>
  <rect x="300" y="552" width="270" height="27" rx="13" fill="#f5f8fc"/>
  <text x="435" y="570" text-anchor="middle" class="small">req[3:0] ↔ grant[3:0]</text>

  <path d="M335 540 V566 H800 V605" class="wire" marker-start="url(#arrowBothStart)" marker-end="url(#arrow)"/>
  <path d="M655 540 V566 H850 V605" class="wire" marker-start="url(#arrowBothStart)" marker-end="url(#arrow)"/>
  <path d="M930 540 V566 H900 V605" class="wire" marker-start="url(#arrowBothStart)" marker-end="url(#arrow)"/>
  <path d="M1195 540 V566 H950 V605" class="wire" marker-start="url(#arrowBothStart)" marker-end="url(#arrow)"/>
  <rect x="725" y="552" width="280" height="27" rx="13" fill="#f5f8fc"/>
  <text x="865" y="570" text-anchor="middle" class="small">per-channel memory signals</text>

  <rect x="170" y="605" width="400" height="142" class="block" fill="#fff2d9"/>
  <text x="198" y="638" class="heading">Round-Robin Arbiter</text>
  <text x="198" y="665" class="body">dma_arbiter_final</text>
  <text x="198" y="688" class="body">Rotating priority from last_grant</text>
  <text x="198" y="711" class="body">Arbitration held off during bus_busy</text>
  <rect x="198" y="720" width="177" height="20" rx="7" fill="#f8dfab"/>
  <text x="286" y="734" text-anchor="middle" class="small">active-burst lock</text>

  <rect x="665" y="605" width="390" height="142" class="block" fill="#e5e8fc"/>
  <text x="692" y="638" class="heading">Shared Memory Interface Mux</text>
  <text x="692" y="665" class="body">Selects the active channel's address</text>
  <text x="692" y="688" class="body">Read/write controls, write data and valid</text>
  <text x="692" y="711" class="body">Routes read data and ready back to channel</text>
  <path d="M570 675 H656" class="wire" marker-end="url(#arrow)"/>
  <text x="613" y="660" text-anchor="middle" class="small">channel select</text>

  <rect x="1135" y="615" width="235" height="122" class="block" fill="#e2f0fb"/>
  <text x="1157" y="646" class="heading">External Memory</text>
  <text x="1157" y="673" class="body">32-bit data</text>
  <text x="1157" y="695" class="body">mem_addr / mem_wdata</text>
  <text x="1157" y="717" class="body">mem_valid / mem_ready</text>
  <path d="M1055 675 H1126" class="wire" marker-end="url(#arrow)"/>

  <!-- PMU monitoring -->
  <path d="M850 747 V786" class="monitor" marker-end="url(#arrowDash)"/>
  <path d="M450 747 V786" class="monitor" marker-end="url(#arrowDash)"/>
  <rect x="360" y="786" width="650" height="139" class="block" fill="#f0eafb"/>
  <text x="390" y="821" class="heading">Performance Monitoring Unit (PMU)</text>
  <text x="390" y="850" class="body">Global counters: total cycles, busy cycles, words, bursts, grants</text>
  <text x="390" y="874" class="body">Per-channel word and burst counters; decoded current burst size</text>
  <text x="390" y="898" class="body">Memory-mapped readback • PMU clear at 0x94 • adaptive mode at 0x98</text>
  <path d="M1000 850 H1080 V240 H1190" class="monitor" marker-end="url(#arrowDash)"/>
  <text x="1090" y="835" class="small">counter readback / control</text>

  <!-- Legend -->
  <line x1="1070" y1="810" x2="1115" y2="810" class="wire" marker-end="url(#arrow)"/>
  <text x="1125" y="815" class="small">Functional / data path</text>
  <line x1="1070" y1="844" x2="1115" y2="844" class="monitor" marker-end="url(#arrowDash)"/>
  <text x="1125" y="849" class="small">Monitoring / status</text>

  <text x="60" y="970" class="small">Block-level RTL architecture; see rtl/dma_final.v and docs/architecture/architecture.md for implementation details.</text>
</svg>